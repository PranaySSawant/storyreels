name: selftest
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: voices + sources
        run: |
          python - <<'PY'
          import random
          from storyreels import tts, sources
          for s in ('narrator', 'villain', 'woman', 'child'):
              print(s, round(tts.synth('पिछले भाग में... अभिमन्यु चक्रव्यूह में अकेला रह गया था।', s, f'/tmp/{s}.wav'), 2))
          l, t = sources.reference('karna_kavach', 'कर्ण', 'Indra asks Karna for his armour')
          print('reference:', l, len(t))
          for g in ('myth', 'history', 'ghost'):
              print(g, sources.discover(g, set(), random.Random(1)))
          PY
