name: selftest
on: workflow_dispatch
permissions:
  contents: write
jobs:
  hide-test-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Turn TEST releases into private drafts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.tag_name | startswith("test-")) | .id'); do
            gh api -X PATCH repos/${{ github.repository }}/releases/$id -F draft=true --jq '.tag_name + " draft=" + (.draft|tostring)'
          done
