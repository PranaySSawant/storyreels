name: make-reel

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # checks every 15 min; the gate below makes a reel only if the last one is ~1h old (GitHub drops some scheduled runs)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Write + render only, do not post'
        type: boolean
        default: true

concurrency:
  group: storyreels
  cancel-in-progress: false

permissions:
  contents: write                  # push the 'state' and 'media' branches
  actions: write                   # let each run start the next one (self-scheduling chain)

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATA_DIR: ${{ github.workspace }}/data
      PIPER_VOICES_DIR: ${{ github.workspace }}/voices
      RENDER_SCALE: ${{ vars.RENDER_SCALE || '3' }}   # 3 = 4K master (2160x3840), 1 = 720p
    steps:
      - uses: actions/checkout@v4

      - name: Gate (one reel per hour)
        id: gate
        env:
          INTERVAL_MIN: ${{ vars.INTERVAL_MIN || '60' }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ] && git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch -q origin state
            last=$(git show origin/state:state.json 2>/dev/null | python3 -c "import sys,json;p=json.load(sys.stdin).get('posts',[]);print(p[-1]['t'] if p else 0)" || echo 0)
            age=$(( ($(date +%s) - last) / 60 ))
            echo "last reel ${age} min ago"
            if [ "$age" -lt $(( INTERVAL_MIN - 8 )) ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: System packages
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo timeout 240 apt-get update -qq -o Acquire::Retries=3 && \
            sudo timeout 240 apt-get install -y -qq --no-install-recommends ffmpeg fonts-noto-core && break
            echo "apt attempt $i failed, retrying"; sleep 10
          done
          which ffmpeg

      - name: Cache Hindi voices
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-hi-voices-v1

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install -q -r requirements.txt
          bash scripts/get_voices.sh voices

      - name: Load state (from 'state' branch)
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin state >/dev/null; then
            git fetch -q origin state
            git archive origin/state | tar -x -C data
          fi
          ls -la data

      - name: Write, render, post
        if: steps.gate.outputs.skip != 'true'
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}          # empty -> groq if GROQ_API_KEY is set, else anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-sonnet-5-5' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}      # Make/Zapier mode (then IG_* secrets are not needed)
          MAIL_TO: ${{ secrets.MAIL_TO }}              # email mode: release + email download links, no auto-posting
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m storyreels.main run --dry-run
          else
            python -m storyreels.main run
          fi

      - name: Save state (to 'state' branch)
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          cd data
          [ -f state.json ] || exit 0
          rm -rf .git && git init -q && git checkout -q -b state
          git add state.json $( [ -f ig_token.json.enc ] && echo ig_token.json.enc )
          git -c user.name=storyreels-bot -c user.email=bot@users.noreply.github.com commit -q -m "state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state

      - name: Keep the reels as build artifacts (1080p post + 4K master)
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: |
            data/out/*.mp4
            data/pipeline.log
          retention-days: 3
          if-no-files-found: ignore

  # GitHub's cron is unreliable on this repo, so each run starts the next one itself:
  # wait until INTERVAL_MIN after this run started, then dispatch the workflow again.
  # (workflow_dispatch from GITHUB_TOKEN is allowed to start new runs; public repo = free minutes)
  next:
    needs: reel
    if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run != true && vars.CHAIN != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          INTERVAL_MIN: ${{ vars.INTERVAL_MIN || '60' }}
        run: |
          started=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          wait=$(( INTERVAL_MIN * 60 - elapsed ))
          echo "run started $started, waiting ${wait}s"
          [ "$wait" -gt 0 ] && sleep "$wait"
          gh workflow run post-reel.yml --repo ${{ github.repository }} --ref main -f dry_run=false
          echo "next run dispatched"
